name: Monitor de precos

# Como roda:
# - De 24/11 a 30/11 (Black Friday → Cyber Monday) cada execução agenda a próxima ~10 min
#   depois (job "encadear"), sem depender do cron do GitHub, que atrasa ou pula execuções.
# - Os crons abaixo ficam como rede de segurança: reiniciam a corrente se ela parar,
#   e garantem a leitura a cada 2 h no resto do ano.
on:
  schedule:
    # Horários em UTC (São Paulo = UTC-3).
    - cron: "*/30 * 24-30 11 *"   # reserva durante a Black Friday
    - cron: "*/30 0-3 1 12 *"     # até 30/11 23h50 em São Paulo
    - cron: "17 */2 * 1-10,12 *"  # resto do ano: a cada 2 h
    - cron: "17 */2 1-23 11 *"
  push:                           # mudança de código também dispara uma leitura
    branches: [main]
    paths: [".github/workflows/monitor.yml", "monitor.py", "config.json"]
  workflow_dispatch:
    inputs:
      resumo:
        description: "Enviar o resumo agora (teste do Telegram)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# no máximo 1 execução rodando + 1 na fila (as extras são descartadas)
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Coletar precos e alertar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAGINA_URL: https://leo-barbieri.github.io/monitor-precos/
        run: python monitor.py ${{ inputs.resumo && '--resumo' || '' }}
      - name: Salvar historico
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "dados: $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase -q && git push
      - name: Preparar pagina de precos
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.pagina.outputs.page_url }}
    steps:
      - name: Publicar pagina (GitHub Pages)
        id: pagina
        uses: actions/deploy-pages@v4

  encadear:
    needs: [coletar, publicar]
    if: ${{ !cancelled() }}   # mesmo se uma etapa falhar, a corrente continua
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Agendar a proxima leitura (so na Black Friday)
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          agora=$(TZ=America/Sao_Paulo date '+%m%d%H%M')
          if [ "$agora" \< "11240000" ] || [ "$agora" \> "11302340" ]; then
            echo "Fora da janela da Black Friday: sem encadeamento."; exit 0
          fi
          sleep 420
          # até 6 tentativas (a API do GitHub às vezes falha por instantes)
          for i in 1 2 3 4 5 6; do
            if gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "Proxima leitura agendada (tentativa $i)."; exit 0
            fi
            echo "Tentativa $i falhou."; sleep $((i * 15))
          done
          # não deu: avisa no Telegram para você reiniciar com um toque
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID%%,*}" \
            --form-string "text=⚠️ Monitor de preços parou: não consegui agendar a próxima leitura. Toque em Run workflow para reiniciar: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/monitor.yml"
          exit 1
