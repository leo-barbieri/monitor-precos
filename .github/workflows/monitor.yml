name: Monitor de precos

on:
  schedule:
    # Horários em UTC (São Paulo = UTC-3).
    - cron: "*/10 * 26-30 11 *"   # Black Friday → Cyber Monday: a cada 10 min
    - cron: "*/10 0-3 1 12 *"     # até 30/11 23h50 em São Paulo
    - cron: "17 */2 * * *"        # resto do ano: a cada 2 h
  workflow_dispatch:
    inputs:
      resumo:
        description: "Enviar o resumo agora (teste do Telegram)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar precos e alertar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python monitor.py ${{ inputs.resumo && '--resumo' || '' }}
      - name: Salvar historico
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "dados: $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase -q && git push
